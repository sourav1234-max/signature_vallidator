services:
  - type: web
    name: digital-signature-validator-api
    env: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: validator-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["https://digital-signature-validator.vercel.app","http://localhost:3000"]'

databases:
  - name: validator-postgres
    region: oregon
    databaseName: signature_validator_db
    user: validator_user
